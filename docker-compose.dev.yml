services:
  postgres:
    image: postgres:17-alpine
    container_name: blog-api-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog-api
    volumes:
      - blog_api_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: blog-api-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - blog_api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blog_api_pg_data:
  blog_api_redis_data:
